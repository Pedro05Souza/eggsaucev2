services:
  bot:
    container_name: eggsauce_bot
    build: .
    command: python3 app.py
    volumes:
      - .:/app
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:3
    networks:
      - eggsauce_network

  db:
    container_name: eggsauce_db
    # Pinned: data files are tied to the major version, so upgrading needs a pg_upgrade.
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: 'eggsauce'
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    networks:
      - eggsauce_network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - eggsauce_network

volumes:
  db-data:

networks:
  eggsauce_network:
    driver: bridge