services:
  bot:
    container_name: eggsauce_bot
    build: .
    command: python3 app.py
    volumes:
      - .:/app
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: on-failure:3
    networks:
      - eggsauce_network

  db:
    container_name: eggsauce_db
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: 'eggsauce'
      PGDATA: /data/postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - eggsauce_network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - eggsauce_network

volumes:
  db-data:

networks:
  eggsauce_network:
    driver: bridge