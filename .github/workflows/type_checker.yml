name: 🛠️ Type checker

on:
  pull_request:

jobs:
    type_checker:
        runs-on: ubuntu-latest
    
        steps:
          - name: Checkout code
            uses: actions/checkout@v3
    
          - name: Set up Python
            uses: actions/setup-python@v4
            with:
              python-version: "3.12"

          - name: Install UV
            uses: astral-sh/setup-uv@v2

          - name: Install dependencies
            run: |
              uv sync

          - name: Run pyright
            run: |
              pyright .
