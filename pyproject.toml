[tool.pylint]
disable = ["C0114", "C0115", "C0116", "R0903", "W0703", "R0913", "R0917", "R0902", "W0511"]
max-line-length = 120
suggestion-mode = true
ignore=["venv", "migrations", "build"]

[tool.aerich]
tortoise_orm = "tools.constants.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.black]
line-length = 120

[tool.pyright]
include = ["**/*.py"]
exclude = ["**/migrations/**", "**/venv/**", "**/build/**", "**/__init__.py", "**/__pycache__/**"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportAttributeAccessIssue = "none"
reportUnusedImport = "warning"
reportUnusedFunction = "warning"
reportUnusedClass = "warning"
reportUnusedVariable = "warning"
